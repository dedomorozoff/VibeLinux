# /etc/mkinitcpio.conf for VibeLinux Live ISO

MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm vboxguest vboxsf vboxvideo)
BINARIES=()
FILES=()

# HOOKS: archiso is REQUIRED for live ISO to find and mount AI rootfs
# NOTE: no `autodetect` — it prunes modules to the build host's hardware
# (e.g. sr_mod for CD-ROM is dropped on hosts without an optical drive),
# which breaks booting from the ISO as an optical disc in VMs (VirtualBox).
HOOKS=(base udev modconf kms block filesystems keyboard fsck archiso)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
