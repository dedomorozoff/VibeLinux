#
# VibeLinux pacman configuration
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
# CheckSpace: отключено — в chroot (customize_airootfs) pacman не может
# определить точку монтирования '/' и падает с «not enough free disk space».
# Официальный archiso (releng) также держит CheckSpace выключенным.
#CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist


